[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pyFoundationTools"
version = "0.0.2"
description = "A compliation of code reuse for python, this is focusing on extending only the base python framework with no additional depenencies."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">= 3.10"
authors = [
  {name = "Nicholas Bergantz", email = "nicholas.bergantz@gmail.com"}
]
keywords = [
  
]
classifiers = [

]
license = {text = "MIT"}
dependencies = [
  
]

[project.optional-dependencies]
develop = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "build",
    "bump2version",
    "mypy",
    "ty",
    "twine",
]
personal_repos = []

[project.urls]

bugs = "https://github.com/kopecn/pyFoundationTools/issues"
changelog = "https://github.com/kopecn/pyFoundationTools/blob/master/changelog.md"
homepage = "https://github.com/kopecn/pyFoundationTools"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
testpaths = ["tests/*"]
python_functions = ["test*"]
python_files = ["test*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ty.environment]
python-version = "3.10"
root = ["src"]
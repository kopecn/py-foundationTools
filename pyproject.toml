[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pyFoundationTools"
version = "0.0.5"
description = "A dependency-free Python collection providing reusable code extensions and foundational type utilities built exclusively on Python’s standard library. Designed to establish a consistent type foundation across automation modules."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [
  {name = "Nicholas Bergantz", email = "nicholas.bergantz@gmail.com"}
]
keywords = ["pyFoundationTools", "python", "package"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
license = {text = "MIT"}
# Runtime dependencies — NAMES ONLY, never version-pinned (BKM: only the application
# layer pins; module-level pins cause dependency conflicts). Put any version pins,
# tag-pins, or git-based pointers in requirements*.txt — NEVER here (git URLs in
# pyproject are a module-deployment disaster). e.g.:
#   dependencies = ["requests"]
dependencies = [
]

# First-class quality tooling: flake8 (lint) + black (format) + mypy (typecheck).
# ruff and ty are kept installed but SECOND-CLASS — available, not wired into the gate.
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "flake8",
    "flake8-bugbear",
    "black",
    "mypy",
    "build",
    "bump2version",
    "twine",
    # second-class (available, not in the gate):
    "ruff",
    "ty",
]

[project.urls]

bugs = "https://github.com/kopecn/py_foundation_tools/issues"
changelog = "https://github.com/kopecn/py_foundation_tools/blob/prod/HISTORY.md"
homepage = "https://github.com/kopecn/py_foundation_tools"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
testpaths = ["tests/*"]
python_functions = ["test*"]
python_files = ["test*.py"]
# src/ layout: let pytest import the package without an install (so `make test` and a
# bare `pytest` work on a fresh checkout).
pythonpath = ["src"]

# Path resolution: the Makefile scopes quality targets via PY_* vars (.env sets
# PY_SRC=src for this src/ layout). The config below is the fallback that makes a
# bare invocation (no path args) and IDE integrations resolve the same scope.

# FIRST-CLASS formatter. line-length matches flake8's max-line-length (100).
[tool.black]
line-length = 100
target-version = ["py311"]

# SECOND-CLASS. ruff is kept configured/installed but is not wired into the gate;
# flake8 + black own linting/formatting. See `.flake8` and [tool.black].
[tool.ruff]
target-version = "py311"  # support floor; default dev interpreter is 3.13
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["D301"]  # example

[tool.ruff.lint.per-file-ignores]
# Test docstrings carry long descriptive lines; don't wrap them for E501.
"tests/testfoundationDataModelHelper.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
# src/ layout: treat src as the package root so foundation_math.math resolves once,
# not also as src.foundation_math.math (duplicate-module error otherwise).
mypy_path = "src"
explicit_package_bases = true

# Multi-repo co-development: local editable sibling repos and any git-based pointers
# go in requirements-local.txt (NEVER in pyproject — git URLs / path overrides here
# are a module-deployment disaster). `make uv-sync-local` installs that overlay on top
# of the normal env; it is gitignored and never read by CI/release.
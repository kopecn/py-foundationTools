name: CI-CD

on:
  pull_request:
    branches:
      - dev
      - prod
    types:
      - opened
      - synchronize
      - reopened

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install project dependencies
        run: make uv-sync

      - name: Run linter
        run: make uv-lint

      - name: Run type checker
        run: make uv-typecheck

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies
        run: make uv-sync

      - name: Run test suite
        run: uv run --python ${{ matrix.python-version }} pytest